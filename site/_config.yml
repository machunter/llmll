# GitHub Pages configuration.
#
# The site is the blog series and nothing else. It lives in `site/`, not `docs/`,
# and that separation is the point: `docs/` is working material (design proposals,
# the roadmap, schemas) that reads fine on GitHub but is not published. This file
# used to carry an `exclude:` list naming every working doc one by one, which meant
# every new design doc silently became a published page until someone remembered to
# add it here. Directory separation is the fix; there is nothing left to exclude.
#
# Serving `site/` instead of `/` or `/docs` requires the GitHub Actions deployment
# in `.github/workflows/pages.yml` — classic branch-and-folder Pages can only serve
# the repository root or `/docs`.
#
# `jekyll-relative-links` rewrites the posts' relative `*.md` links to their `.html`
# equivalents, which is why the cross-post links work unchanged. Links that point
# outside this directory are absolute GitHub URLs for the same reason: the site
# only serves `site/`. That plugin is a GitHub Pages default and is supplied by the
# `github-pages` gem, so the workflow must build with `actions/jekyll-build-pages`
# rather than a bare `jekyll build` — see the note in the workflow.

title: LLMLL
description: >-
  A language where AI agents write the code and a compiler proves it meets its
  specification.
theme: minima
lang: en

# minima's header is overridden in _includes/header.html, so this key is not
# what suppresses the page nav. Left documented rather than deleted because an
# empty list here reads like it should work, and it does not.
header_pages: []

# The posts carry no YAML front matter, deliberately: adding it would make GitHub
# render a metadata table above every post in the repository view. GitHub Pages
# enables `jekyll-optional-front-matter` by default, which processes markdown
# without front matter, and this default supplies the layout.
#
# `default`, NOT `page`. minima's page.html renders `<h1>{{ page.title }}</h1>`
# itself, which with these files produces an empty h1 above every post (no front
# matter, so no title) and a doubled title on index.md (which has both a
# front-matter title and its own H1). minima's default.html injects no title, so
# each file's own `#` heading is the only one. GitHub Pages also enables
# `jekyll-titles-from-headings` by default, which derives page.title from that
# first heading, so browser tab titles stay correct without front matter.
defaults:
  - scope:
      path: ""
    values:
      layout: default
  # The posts additionally get previous/next links. They are plain pages, not
  # Jekyll `_posts`, so the ordering lives in _data/series.yml and the `series`
  # layout walks it. `series` itself extends `default`.
  - scope:
      path: "blog"
    values:
      layout: series
