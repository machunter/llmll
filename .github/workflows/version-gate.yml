# DRIFT-CI-1 — version-gate automation.
#
# Closes the workflow-YAML residual on docs/compiler-team-roadmap.md row :304
# and the triage routing-table row at
# docs/design/critique-2026-05-23-triage.md:111.
#
# Two jobs:
#   version-gate    — fast (<1 min). C1-C4 + pytest harness tests. No Stack: no
#                     gate in this job has a compiler dependency. DRIFT-DOC-3
#                     LEFT THIS JOB at TOOL-RFC-004 and this line said otherwise
#                     for a release; DRIFT-DOC-4 LEFT IT at TOOL-RFC-005, for
#                     the same reason and under the campaign rule that reason
#                     produced. See the comment at either step in spec-roundtrip.
#                     THIS JOB NOW ANSWERS NO DOCUMENTATION QUESTION AT ALL.
#   spec-roundtrip  — slower (~16-17 min warm, measured over runs 31328105593
#                     and 31332324160; it was ~11 min before the example suite
#                     joined it, and this line said "~5 min" while the job was
#                     already taking eleven). C5 + DRIFT-CT-2 +
#                     BUILD-GATE-1 + the refute-crux verdict gate + the hspec
#                     example suite. Builds llmll, runs `stack test` under
#                     --fail-on=pending (CI-BUILD-TEST-1),
#                     scripts/doc_claims_gate.sh (doc restriction-claims vs
#                     compiler behaviour), scripts/refute-crux-gate.sh (frozen
#                     verify verdicts), scripts/build_smoke.sh, and
#                     scripts/spec_roundtrip.py against opt-in spec blocks.
#
# Scope discipline: this workflow enforces the four drift gates. DRIFT-CI-1
# (banner/schema equality) and DRIFT-DOC-3 (archive disposition vs directory) are
# consistency gates over in-repo records. DRIFT-CT-2 (doc restriction-claims vs
# actual compiler behaviour) is the only one with an oracle outside the
# repository, because it executes the compiler. DRIFT-DOC-4 (prose path
# citations) is ADVISORY and never fails; the reason lived in the Python
# reference's module docstring until TOOL-RFC-005 retirement deleted it, and it
# is now in docs/UPDATE-PROTOCOL.md. It does not run the Python harness suites at
# tools/llmll-orchestra/ and experiments/.
#
# It DOES run `stack test`, as of CI-BUILD-TEST-1 (v0.14.94). This paragraph
# called build/test CI "a separate ticket" from the day the file was written,
# and no such ticket existed until v0.14.93 filed one; the roadmap row is the
# decision, not the deferral. The file keeps the name `version-gate.yml` rather
# than `ci.yml` because the drift gates are still what it is FOR, and the
# example suite rides in the job that already has a solver.
#
# Security posture: no run: block interpolates ${{ github.event.* }} or any
# attacker-controllable context. The only ${{ }} expressions used are
# runner.os (host literal) and hashFiles(...) (deterministic over checked-in
# files). No script consumes PR titles, bodies, or commit messages.

name: version-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-gate:
    name: C1-C4 banner / schema + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The parentheses are required, not stylistic. `||` and `&&` share a
      # precedence level and associate left, so an ungrouped
      #   which jq || sudo apt-get update && sudo apt-get install -y jq
      # parses as (which jq || update) && install: on a runner image that
      # already ships jq, the update is skipped and the install still runs,
      # against package lists baked into the image. Once the archive supersedes
      # the jq version those lists name, the fetch 404s and the job fails for a
      # reason unrelated to any gate. Grouped, the install runs only when jq is
      # genuinely absent, and never without a preceding update.
      - name: Install jq (for schema field extraction)
        run: |
          which jq || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Run version_gate.sh
        run: bash scripts/version_gate.sh

      # DRIFT-DOC-3 MOVED OUT OF THIS JOB at TOOL-RFC-004, and the move is a
      # cost accepted knowingly rather than a tidy-up. It ran here because it
      # needs only bash and awk. Its LLMLL port needs a compiler to build, the
      # published image ships no GHC or Stack, and RFC section 8 cannot delete
      # the reference while the reference is the thing deciding in a job the
      # port cannot reach. So both implementations now run adjacent in
      # spec-roundtrip (RFC section 3, option D, user adjudication 2026-08-09).
      # What this job gives up: an archive-disposition error is a one-line
      # frontmatter mistake and now surfaces behind a Haskell build, ~17m rather
      # than ~25s.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # DRIFT-DOC-4 MOVED OUT OF THIS JOB at TOOL-RFC-005, wholesale, both
      # implementations together. It is in spec-roundtrip now; see the comment
      # at its step there. The job NAME above was corrected in the same commit,
      # because a display name advertising a gate the job does not run is
      # exactly the stale record TOOL-RFC-004 filed against this file.
      #
      # THIS JOB NOW HAS NO PATH-CITATION CHECK AT ALL, and that is the state
      # rather than an oversight. test_clean_on_live_repo imported the reference
      # and was fail-closed on the live tree; the user deleted it with
      # test_doc_path_lint.py on 2026-08-11, and TOOL-RFC-005 §8 records what
      # that costs. The reference itself is deleted at retirement. So the only
      # DRIFT-DOC-4 in the repository is the LLMLL port, in spec-roundtrip, and
      # it is advisory. Nothing blocks a broken prose citation from reaching
      # main. See TOOL-RFC-005 §8 for the door that stays open.
      - name: Install pytest
        run: pip install pytest

      - name: Run harness pytest suite
        run: python -m pytest scripts/tests/ -v

  spec-roundtrip:
    name: C5 opt-in spec round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell (Stack)
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Cache Stack global + project work
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            compiler/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('compiler/stack.yaml', 'compiler/stack.yaml.lock', 'compiler/package.yaml') }}
          restore-keys: |
            stack-${{ runner.os }}-

      - name: Build llmll
        working-directory: compiler
        run: stack build llmll

      # DRIFT-DOC-3 and its LLMLL port, adjacent, which is what `tool_state:
      # oracle` means: both decide over the same tree in the same run and a
      # reader compares them in one job log rather than across two jobs.
      # Deliberately placed immediately after the compiler build and BEFORE
      # every solver-dependent step: this gate needs no solver, and RFC section
      # 3 requires it to run even when a later step would fail, so it is never
      # made conditional on anything.
      - name: Run archive-disposition drift gate (DRIFT-DOC-3)
        run: bash scripts/doc_archive_gate.sh

      # The absolute path, not `stack exec`: that idiom resolves against
      # whatever stack project the cwd sits in, and from a tools/ directory it
      # once installed GHC 9.10.3 on a runner before answering "Executable
      # named llmll not found".
      - name: Run archive-disposition drift gate (LLMLL port, TOOL-RFC-004)
        run: |
          set -euo pipefail
          SUBJECT="$(cd compiler && stack path --local-install-root)/bin/llmll"
          OUT="$RUNNER_TEMP/docarchive-build"
          ( cd tools/doc-archive && "$SUBJECT" build docarchive.llmll -o "$OUT" )
          # ASK STACK WHERE IT PUT THE BINARY. DO NOT SEARCH FOR IT. The full
          # argument is at scripts/build_smoke.sh's exe_path, which removed the
          # same idiom from twelve sites: `find | head -1` has no defined answer
          # when a tree holds more than one install root, because find emits in
          # readdir order. It does not fail here today only because RUNNER_TEMP
          # is fresh and holds exactly one candidate. The line above already
          # asks stack for the COMPILER; this asks for the port the same way.
          #
          # The test is -x and NOT -n: the path is now always non-empty, so an
          # -n guard would pass unconditionally and stop guarding anything.
          GROOT="$( (cd "$OUT" && stack path --local-install-root) 2>/dev/null || true )"
          GATE="$GROOT/bin/docarchive"
          [ -n "$GROOT" ] && [ -x "$GATE" ] \
            || { echo "no docarchive binary under $OUT (stack root: ${GROOT:-<none>})"; exit 1; }
          # The COVER runs first, for 003's reason: it decides whether the port
          # agrees with the reference UNDER MUTATION, which a live green run does
          # not. This gate makes that concrete, its live corpus declaring exactly
          # one disposition. The cover found three real defects in this port
          # before it shipped, none reachable from the live tree.
          python3 scripts/doc_archive_cover.py --gate "$GATE" --repo .
          # The step budget comes from python3 and NOT `yes x | head -n N`:
          # `yes` dies of SIGPIPE and this step runs under pipefail.
          python3 -c "import sys; sys.stdout.write('x\n' * 600)" \
            | "$GATE" --root "$GITHUB_WORKSPACE"

      # Before the gates and not after them. The refute-crux port's step drives
      # its console loop from a python3-generated step budget and runs the
      # differential cover, so python3 is a declared dependency of a gate in
      # this job rather than something the runner image happens to ship.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run doc-claim drift gate (DRIFT-CT-2)
        working-directory: compiler
        env:
          LLMLL_BIN: stack exec llmll --
        run: bash ../scripts/doc_claims_gate.sh

      # TOOL-RFC-003: the same gate as the step above, in LLMLL, run ADJACENT to
      # its reference so the `oracle` state is legible in one job log. Both
      # decide over the same tree in the same run and a reader compares them
      # without cross-referencing two jobs, which is 002's arrangement and its
      # reason.
      #
      # The differential COVER runs first: it decides whether the port AGREES
      # with the reference under mutation, which a live green run on its own
      # does not. It found two real defects in the port before either shipped:
      # a `warn` observation promoted on the trigger rather than on the whole
      # match, and a subject probe that SKIPPED where the reference FAILS.
      #
      # The absolute path, not `stack exec`: that idiom resolves against
      # whatever stack project the cwd sits in, and from a tools/ directory it
      # once installed GHC 9.10.3 on a runner before answering "Executable
      # named llmll not found".
      - name: Run doc-claim drift gate (LLMLL port, TOOL-RFC-003)
        run: |
          set -euo pipefail
          SUBJECT="$(cd compiler && stack path --local-install-root)/bin/llmll"
          OUT="$RUNNER_TEMP/docclaims-build"
          ( cd tools/doc-claims && "$SUBJECT" build docclaims.llmll -o "$OUT" )
          # Ask stack, do not search; see the archive gate step above and
          # scripts/build_smoke.sh's exe_path. -x rather than -n, because the
          # path is always non-empty now.
          GROOT="$( (cd "$OUT" && stack path --local-install-root) 2>/dev/null || true )"
          GATE="$GROOT/bin/docclaims"
          [ -n "$GROOT" ] && [ -x "$GATE" ] \
            || { echo "no docclaims binary under $OUT (stack root: ${GROOT:-<none>})"; exit 1; }
          python3 scripts/doc_claims_cover.py --gate "$GATE" --llmll "$SUBJECT"
          mkdir -p "$RUNNER_TEMP/dc-work" "$RUNNER_TEMP/dc-run"
          ( cd "$RUNNER_TEMP/dc-run" \
              && python3 -c "import sys; sys.stdout.write('x\n' * 400)" \
                   | "$GATE" --root "$GITHUB_WORKSPACE" --subject "$SUBJECT" \
                             --work "$RUNNER_TEMP/dc-work" ) > "$RUNNER_TEMP/dc.log" 2>&1 \
            || { grep -v '^$' "$RUNNER_TEMP/dc.log" >&2; exit 1; }
          grep -v '^$' "$RUNNER_TEMP/dc.log"

      # TOOL-ENCODING-1's end-to-end half. It lives HERE and not in the pytest
      # step of the C1-C4 job for a reason worth stating: that job sets up
      # Python and jq and no Haskell toolchain, so `llmll` does not exist there
      # and every test in this file would SKIP. A gate that skips reports green
      # by not running, which is the failure this campaign keeps finding. The
      # same reasoning and the same shape govern test_driver_ll_4a_cover.py.
      #
      # This half is platform-independent: it feeds invalid UTF-8 and asserts a
      # diagnostic rather than an escaped GHC exception, which fails on the
      # unfixed tree on macOS too. The LOCALE half cannot be tested here at all
      # and is gated by doc_claims_cover.py above, which scrubs the environment
      # and therefore only discriminates on Linux.
      # The absolute path, not `stack exec`: that idiom resolves against whatever
      # stack project the cwd sits in, and from a non-project directory it once
      # installed GHC 9.10.3 on a runner before answering "Executable named llmll
      # not found". Same trap as the doc-claims step above.
      # `actions/setup-python` installs an interpreter and NOT pytest, and this
      # job had never needed one: every gate above it is a shell script or a
      # plain `python3` invocation. The C1-C4 job installs pytest explicitly for
      # the same reason. Omitting it here failed this step with `No module named
      # pytest` on the first Linux run, which is finding 6 one turn on again — a
      # gate wired into a job that cannot run it. It failed LOUDLY, which is the
      # only reason it cost one run rather than shipping green-by-not-running.
      - name: Install pytest (this job now hosts a pytest-based gate)
        run: pip install pytest

      - name: Run source-encoding gate (TOOL-ENCODING-1)
        run: |
          set -euo pipefail
          SUBJECT="$(cd compiler && stack path --local-install-root)/bin/llmll"
          LLMLL_BIN="$SUBJECT" python3 -m pytest scripts/tests/test_source_encoding.py -v

      # The refute-crux gate parses EXPECTED_VERDICTS.json with jq. The runner
      # image ships it, but this job never asserted that; the script's own
      # missing-jq message reads "brew install jq", which is the wrong advice on
      # a Linux runner and would misdirect whoever read the log. Grouped for the
      # `||`/`&&` precedence reason spelled out in the version-gate job above.
      - name: Install jq (for frozen-verdict extraction)
        run: |
          which jq || (sudo apt-get update && sudo apt-get install -y jq)

      # THE SOLVER. `llmll verify` proves nothing by itself: it shells out to
      # `fixpoint` (liquid-fixpoint), which shells out to z3. Absent either it
      # exits 3 — "solver unavailable (proof did not run)",
      # compiler/app/Main.hs:1386 — for every case whose verdict needs a proof.
      #
      # This job had Stack and nothing else from the day it was written, and the
      # reason nothing noticed is worth keeping: no gate in it had ever asked for
      # a proof. doc_claims_gate.sh, build_smoke.sh and spec_roundtrip.py all
      # decide without one, so the job ran green in ~2 minutes while being
      # incapable of verifying a single program. The refute-crux gate wired in at
      # a23e361 is the first that cannot, and its first run on Linux reported 78
      # of 80 frozen verdicts as diverged when not one had: all 78 were exit 3.
      # The two that passed are what identify the cause rather than leaving it
      # inferred — they are the only two whose verdict is reached BEFORE the
      # solver (a capability refusal and a coverage threshold).
      - name: Install z3 (fixpoint shells out to it)
        run: |
          which z3 || (sudo apt-get update && sudo apt-get install -y z3)
          z3 --version

      # Keyed on the pin file alone, and a SEPARATE cache from the Stack one
      # above on purpose. That key is hashFiles() over the compiler's stack.yaml,
      # which this pin does not appear in, so a fixpoint built into ~/.stack
      # would ride a key that cannot express whether it is there. Worse, on an
      # exact key hit actions/cache skips the save, so the build below would
      # repeat in full on every run while the cache reported healthy.
      - name: Cache fixpoint binary
        id: cache-fixpoint
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/fixpoint
          key: fixpoint-${{ runner.os }}-${{ hashFiles('scripts/fixpoint.stack.yaml') }}

      # Expensive once, then restored as a single binary. The recipe is copied
      # from Dockerfile:40-49 rather than invented, which is what makes it a
      # proven mechanism and not a guess: that Dockerfile builds this exact
      # version against this exact snapshot, and scripts/tests/docker-acceptance.sh
      # passing against the resulting image is what says the distro z3 shipped
      # beside it is adequate for these proofs.
      - name: Build liquid-fixpoint (fixpoint)
        if: steps.cache-fixpoint.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          stack --stack-yaml scripts/fixpoint.stack.yaml \
            install liquid-fixpoint-0.9.6.3.1 --local-bin-path "$HOME/.local/bin"

      # Separate step because GITHUB_PATH takes effect in SUBSEQUENT steps, not
      # the one that writes it. The assertion is here rather than left to the
      # gate so an absent solver fails naming itself, instead of 78 cases each
      # reporting a verdict that did not diverge.
      - name: Put fixpoint on PATH and assert the toolchain is complete
        run: |
          set -euo pipefail
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/bin/fixpoint" \
            || { echo "fixpoint missing at $HOME/.local/bin/fixpoint"; exit 1; }

      # CI-BUILD-TEST-1. The hspec example suite, which until now has NEVER run
      # in CI: this workflow's header called build/test CI "a separate ticket"
      # and no ticket existed, so all 1675 examples were a local-only gate and a
      # green `main` said nothing about them.
      #
      # THE POSITION IS LOAD-BEARING AND SO IS THE FLAG. 53 of the 1675 examples
      # shell out to `fixpoint` (test/Spec.hs, findExecutable "liquid-fixpoint"
      # / "fixpoint" / "z3") and call `pendingWith` when it is absent. Measured
      # on the same tree with only PATH differing:
      #
      #   solver present -> 1675 examples, 0 failures              exit 0
      #   solver absent  -> 1675 examples, 0 failures, 53 pending  exit 0
      #
      # The headline count a reader checks against the CHANGELOG is 1675 either
      # way, and hspec scores pending as non-failure, so the exit code does not
      # discriminate either. Run in the C1-C4 job, which has no Haskell
      # toolchain, this step would report green having skipped 53 tests: the
      # same class as findings 6 and 12 and SKIP-SILENT-1, for the fifth time.
      #
      # `--fail-on=pending` is what makes it decide rather than report. Verified
      # in both directions rather than assumed: with the solver it exits 0 at
      # 1675/0, and with the solver hidden it exits 1 at "1675 examples, 53
      # failures". That also makes THIS STEP'S POSITION self-enforcing — placed
      # above the toolchain assertion it fails loudly instead of passing
      # hollowly, so the ordering cannot rot silently.
      #
      # Before refute-crux and not after: a unit-test failure localizes better
      # than a frozen-verdict divergence, and failing here first saves the ~5
      # minutes of solver time that gate spends.
      #
      # Cost: the RUN is 11.5s. What this step actually pays for is building the
      # test component, which `stack build llmll` above does not build. Measured
      # locally at 203s (macOS/aarch64) to recompile a 16,616-line single-module
      # Spec.hs; the ubuntu-latest figure is UNMEASURED until this step's first
      # run, which is the point of the row.
      # DRIFT-DOC-4 RELOCATED HERE FROM THE FAST JOB at TOOL-RFC-005, wholesale,
      # reference and port together. The campaign rule this follows was amended
      # at the same time and is the reason for the "wholesale": the published
      # image delivers a COMPILER and not a COMPILED PORT, so a port runs only
      # where a toolchain built it, and splitting a gate across two jobs leaves
      # retirement unable to delete a reference that is the only thing running
      # in the job that matters. TOOL-RFC-001 split, and 004 recorded why that
      # was wrong.
      #
      # WHAT THIS COSTS, and it is accepted knowingly: an advisory report that
      # used to appear in about 25 seconds now appears behind a Haskell build,
      # about 17 minutes in. That is cheaper here than it was for DRIFT-DOC-3,
      # because DRIFT-DOC-3 blocks a merge and this gate decides nothing, so
      # what moved is when a reader sees a suggestion.
      #
      # THE REFERENCE IS GONE. scripts/doc_path_lint.py and its differential
      # cover were deleted at TOOL-RFC-005 retirement, one release after the
      # port landed, per the campaign's settled retirement rule. The step below
      # is the whole of DRIFT-DOC-4 now.
      #
      # TOOL-RFC-005: the gate in LLMLL. It ran adjacent to its reference for
      # one release, which is what `tool_state: oracle` meant, and it is now the
      # only implementation.
      #
      # THE CORE IS VERIFIED BEFORE THE PORT IS BUILT, and the order is a
      # requirement rather than tidiness. adjudicate.llmll carries the three
      # proved functions the port delegates its decision to, and its
      # .verified.json sidecar is gitignored. Measured: without that sidecar
      # `llmll check` on the port warns that it inherits an unproven contract
      # for `reports?`, so a port built without this step silently drops to
      # `asserted` on the one function §7 counts as proved.
      #
      # THIS PAIR SITS AFTER THE TOOLCHAIN ASSERTION, AND THAT IS WHY. `llmll
      # verify` needs liquid-fixpoint and z3; placed with the other doc gates,
      # immediately after the compiler build, it exited 3 with "SOLVER NOT FOUND
      # -- NOTHING WAS PROVEN" on run 31439638684. This is the FIRST port in the
      # campaign to verify anything in CI rather than only build, so it is the
      # first with a solver dependency, and DRIFT-DOC-3's port runs early
      # precisely because it does not have one. Do not move this pair back up
      # with the other documentation gates.
      #
      # THE COVER IS GONE, AND WITH IT THE ONLY INSTRUMENT THAT GRADED THIS
      # PORT. doc_path_lint_cover.py pinned REF = scripts/doc_path_lint.py and
      # diffed the two implementations under mutation, so it could not outlive
      # the reference. That was the accepted trade at retirement, taken with the
      # cost stated rather than discovered: what remains below is a live run,
      # and the live corpus reports zero findings, so the whole REPORTING half
      # of the gate never executes here. A live green run is not evidence that
      # this port is correct. TOOL-RFC-005 §6 recorded which two cells were
      # measured to discriminate, cells 9 and 13, if anyone rebuilds a grader.
      - name: Run prose path-citation lint (LLMLL port, TOOL-RFC-005)
        run: |
          set -euo pipefail
          SUBJECT="$(cd compiler && stack path --local-install-root)/bin/llmll"
          ( cd tools/doc-path-lint && "$SUBJECT" verify adjudicate.llmll )
          OUT="$RUNNER_TEMP/pathlint-build"
          ( cd tools/doc-path-lint && "$SUBJECT" build pathlint.llmll -o "$OUT" )
          # Ask stack, do not search; see the archive gate step above and
          # scripts/build_smoke.sh's exe_path. -x rather than -n, because the
          # path is always non-empty now.
          GROOT="$( (cd "$OUT" && stack path --local-install-root) 2>/dev/null || true )"
          GATE="$GROOT/bin/pathlint"
          [ -n "$GROOT" ] && [ -x "$GATE" ] \
            || { echo "no pathlint binary under $OUT (stack root: ${GROOT:-<none>})"; exit 1; }
          # The step budget comes from python3 and NOT `yes x | head -n N`:
          # `yes` dies of SIGPIPE and this step runs under pipefail. The loop
          # takes one step per living file plus five, so 900 is roughly five
          # times the current corpus.
          python3 -c "import sys; sys.stdout.write('x\n' * 900)" | "$GATE"

      - name: Run hspec example suite (CI-BUILD-TEST-1)
        working-directory: compiler
        run: stack test --test-arguments="--fail-on=pending"

      # The refute-crux verdict gate: 80 frozen `llmll verify` verdicts across
      # twelve suites. Until now it was a `make` target only and no workflow ran
      # it. So the regression class it exists to catch (refutation silently
      # lost, as in ENUM-EQ-FALLBACK across v0.14.12 to v0.14.31) was uncaught
      # in CI for the same reason it was uncaught then.
      #
      # Two deviations from its neighbours here, both deliberate. It takes no
      # `working-directory` because it resolves the repo root from its own path
      # and cd's into compiler/ itself for `stack build` and every `verify`. It
      # takes no LLMLL_BIN because it hardcodes the same `stack exec llmll --`
      # this job passes to the other two gates.
      #
      # It does NOT re-run `stack build`, and this comment used to say it did.
      # The stale-binary guard (finding F-3: `stack exec` does not rebuild, so a
      # compiler change graded against the old binary makes a lost refutation
      # read as vacuously SAFE) moved OUT of the script and onto its callers at
      # a23e361, precisely so the LLMLL port would not inherit a dependency on a
      # Haskell build system. In this job the guard is the `Build llmll` step
      # above; in `make` it is the target's own build. Running the script with
      # neither caller grades whatever `stack exec` finds.
      #
      # Measured 80 passed / 0 failed at f555070 — on macOS, where the solver
      # happened to be on PATH. On Linux the same script scored 2 passed / 78
      # failed until the solver steps above existed.
      - name: Run refute-crux verdict gate
        run: bash scripts/refute-crux-gate.sh

      # TOOL-RFC-002: the same gate, in LLMLL, deciding beside the shell one.
      # Adjacent steps on purpose (RFC §8 decision 1): `tool_state: oracle`
      # means both implementations run, and a reader compares their answers in
      # one job log rather than across two jobs.
      #
      # --subject is the freshly-built compiler and is passed EXPLICITLY (RFC
      # §8 decision 2). The harness and the compiler it grades are two
      # different binaries: once this job pulls a published image instead of
      # building, an implicit subject would be the IMAGE's compiler and all 41
      # refuted cases would go vacuously green. That is the defect this gate
      # exists to catch, so the port refuses to leave it implicit.
      #
      # The step budget comes from python3 and NOT `yes x | head -n N`: this
      # job inherits no pipefail, but build_smoke.sh does, and `yes` dies of
      # SIGPIPE by design, which reports 141 no matter what the gate decided.
      # Run from a scratch dir with an absolute --root, because a console
      # program writes <module>.event-log.jsonl into its working directory.
      - name: Run refute-crux verdict gate (LLMLL port, TOOL-RFC-002)
        run: |
          set -euo pipefail
          ROOT="$PWD"
          SUBJECT="$(cd compiler && stack path --local-install-root)/bin/llmll"
          OUT="$RUNNER_TEMP/refutecrux"
          # $SUBJECT and NOT `stack exec llmll --`, which is what this line used
          # to say and what made its first run fail. `stack exec` resolves
          # against the stack project of the CURRENT directory, and
          # tools/refute-crux has no stack.yaml, so stack fell back to the global
          # project — a different resolver, whose GHC (9.10.3) it then spent
          # minutes installing before reporting "Executable named llmll not found
          # on path". The repo-root binary hazard one step further on: not the
          # wrong compiler, no compiler.
          #
          # The absolute path is also the recipe the restart record §5 already
          # gives for running the port by hand. Using $SUBJECT here means the
          # binary that COMPILES the port and the binary it GRADES are the same
          # freshly built one, which is what §8 decision 2 wants anyway.
          ( cd tools/refute-crux && "$SUBJECT" build refutecrux.llmll -o "$OUT" )
          # Ask stack, do not search; see the archive gate step above and
          # scripts/build_smoke.sh's exe_path. -x rather than -n, because the
          # path is always non-empty now.
          GROOT="$( (cd "$OUT" && stack path --local-install-root) 2>/dev/null || true )"
          GATE="$GROOT/bin/refutecrux"
          [ -n "$GROOT" ] && [ -x "$GATE" ] \
            || { echo "no refutecrux binary under $OUT (stack root: ${GROOT:-<none>})"; exit 1; }
          mkdir -p "$RUNNER_TEMP/rc-work" "$RUNNER_TEMP/rc-run"
          # The differential cover first: it decides whether the port AGREES
          # with the reference, which a live green run on its own does not.
          # Sixteen cells, thirteen mutants that must be caught under BOTH
          # implementations plus three negative controls, over a scratch tree
          # whose cases live in two suites. That trim is what keeps this to
          # minutes rather than half an hour, and it bounds the cover to the
          # CRITERIA; corpus coverage is the live run below, which is why both
          # are here and neither is sufficient alone.
          python3 scripts/refute_crux_cover.py --gate "$GATE" --llmll "$SUBJECT"
          # Then the live corpus, which is the port deciding: all 80 frozen
          # verdicts against the compiler this job just built.
          ( cd "$RUNNER_TEMP/rc-run" \
              && python3 -c "import sys; sys.stdout.write('x\n' * 4000)" \
                   | "$GATE" --root "$ROOT" --subject "$SUBJECT" \
                             --work "$RUNNER_TEMP/rc-work" ) > "$RUNNER_TEMP/rc.log" 2>&1 \
            || { grep -v '^$' "$RUNNER_TEMP/rc.log" >&2; exit 1; }
          grep -v '^$' "$RUNNER_TEMP/rc.log"

      # BUILD-GATE-1. Belongs in this job and not in version-gate: that job is
      # deliberately Stack-free (see the header), and this gate's oracle is GHC.
      # Cheap here because generated projects pin the same resolver as the
      # compiler (lts-22.43, CodegenHs.hs emitStackYaml vs compiler/stack.yaml),
      # so ~/.stack is already warm from the build step above. The one-time cost
      # is `async` and `regex-tdfa`, which generated projects depend on and the
      # compiler does not.
      - name: Run end-to-end build gate (BUILD-GATE-1)
        working-directory: compiler
        env:
          LLMLL_BIN: stack exec llmll --
        run: bash ../scripts/build_smoke.sh

      - name: Run spec_roundtrip.py against opt-in LLMLL.md blocks
        working-directory: compiler
        env:
          LLMLL_BIN: stack exec llmll --
          SPEC_FILE: ../LLMLL.md
        run: python3 ../scripts/spec_roundtrip.py
