# DRIFT-CI-1 — version-gate automation.
#
# Closes the workflow-YAML residual on docs/compiler-team-roadmap.md row :304
# and the triage routing-table row at
# docs/design/critique-2026-05-23-triage.md:111.
#
# Two jobs:
#   version-gate    — fast (<1 min). C1-C4 + DRIFT-DOC-3 + DRIFT-DOC-4 + pytest
#                     harness tests. No Stack: no gate in this job has a compiler
#                     dependency.
#   spec-roundtrip  — slower (~5 min steady-state). C5 + DRIFT-CT-2 +
#                     BUILD-GATE-1 + the refute-crux verdict gate. Builds llmll,
#                     runs scripts/doc_claims_gate.sh (doc restriction-claims vs
#                     compiler behaviour), scripts/refute-crux-gate.sh (frozen
#                     verify verdicts), scripts/build_smoke.sh, and
#                     scripts/spec_roundtrip.py against opt-in spec blocks.
#
# Scope discipline: this workflow enforces the four drift gates. DRIFT-CI-1
# (banner/schema equality) and DRIFT-DOC-3 (archive disposition vs directory) are
# consistency gates over in-repo records. DRIFT-CT-2 (doc restriction-claims vs
# actual compiler behaviour) is the only one with an oracle outside the
# repository, because it executes the compiler. DRIFT-DOC-4 (prose path
# citations) is ADVISORY and never fails, for the reason in its module
# docstring. It does not run `stack test` or the Python harness suites
# at tools/llmll-orchestra/ and experiments/. Build/test CI is a separate ticket;
# the workflow file is deliberately named `version-gate.yml`, not `ci.yml`, to
# avoid implying a broader signal.
#
# Security posture: no run: block interpolates ${{ github.event.* }} or any
# attacker-controllable context. The only ${{ }} expressions used are
# runner.os (host literal) and hashFiles(...) (deterministic over checked-in
# files). No script consumes PR titles, bodies, or commit messages.

name: version-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-gate:
    name: C1-C4 banner / schema + DRIFT-DOC-3 / DOC-4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The parentheses are required, not stylistic. `||` and `&&` share a
      # precedence level and associate left, so an ungrouped
      #   which jq || sudo apt-get update && sudo apt-get install -y jq
      # parses as (which jq || update) && install: on a runner image that
      # already ships jq, the update is skipped and the install still runs,
      # against package lists baked into the image. Once the archive supersedes
      # the jq version those lists name, the fetch 404s and the job fails for a
      # reason unrelated to any gate. Grouped, the install runs only when jq is
      # genuinely absent, and never without a preceding update.
      - name: Install jq (for schema field extraction)
        run: |
          which jq || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Run version_gate.sh
        run: bash scripts/version_gate.sh

      # DRIFT-DOC-3. No compiler dependency, so it belongs in the fast job and
      # fails closed rather than skipping. Self-tests against
      # scripts/doc-archive-fixtures/ before scanning docs/archive/.
      - name: Run archive-disposition drift gate (DRIFT-DOC-3)
        run: bash scripts/doc_archive_gate.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # DRIFT-DOC-4 is ADVISORY and exits 0 by design. It cannot decide the
      # counterfactual class (prose that names a path precisely because it does
      # not exist), so a fail-closed version would demand correct prose be
      # mangled. Its value is the printed report in the job log and the
      # test_clean_on_live_repo regression test below, not a merge block.
      - name: Run prose path-citation lint (DRIFT-DOC-4, advisory)
        run: python3 scripts/doc_path_lint.py

      - name: Install pytest
        run: pip install pytest

      - name: Run harness pytest suite
        run: python -m pytest scripts/tests/ -v

  spec-roundtrip:
    name: C5 opt-in spec round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Haskell (Stack)
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Cache Stack global + project work
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            compiler/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('compiler/stack.yaml', 'compiler/stack.yaml.lock', 'compiler/package.yaml') }}
          restore-keys: |
            stack-${{ runner.os }}-

      - name: Build llmll
        working-directory: compiler
        run: stack build llmll

      # Before the gates and not after them. The refute-crux port's step drives
      # its console loop from a python3-generated step budget and runs the
      # differential cover, so python3 is a declared dependency of a gate in
      # this job rather than something the runner image happens to ship.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run doc-claim drift gate (DRIFT-CT-2)
        working-directory: compiler
        env:
          LLMLL_BIN: stack exec llmll --
        run: bash ../scripts/doc_claims_gate.sh

      # The refute-crux gate parses EXPECTED_VERDICTS.json with jq. The runner
      # image ships it, but this job never asserted that; the script's own
      # missing-jq message reads "brew install jq", which is the wrong advice on
      # a Linux runner and would misdirect whoever read the log. Grouped for the
      # `||`/`&&` precedence reason spelled out in the version-gate job above.
      - name: Install jq (for frozen-verdict extraction)
        run: |
          which jq || (sudo apt-get update && sudo apt-get install -y jq)

      # The refute-crux verdict gate: 80 frozen `llmll verify` verdicts across
      # twelve suites. Until now it was a `make` target only and no workflow ran
      # it. So the regression class it exists to catch (refutation silently
      # lost, as in ENUM-EQ-FALLBACK across v0.14.12 to v0.14.31) was uncaught
      # in CI for the same reason it was uncaught then.
      #
      # Two deviations from its neighbours here, both deliberate. It takes no
      # `working-directory` because it resolves the repo root from its own path
      # and cd's into compiler/ itself for `stack build` and every `verify`. It
      # takes no LLMLL_BIN because it hardcodes the same `stack exec llmll --`
      # this job passes to the other two gates.
      #
      # It re-runs `stack build` as a preflight. That is a no-op after the build
      # step above, and it is the script's stale-binary guard (finding F-3):
      # `stack exec` does not rebuild, so without it a compiler change is graded
      # against the old binary and a lost refutation reads as vacuously SAFE.
      # Costs ~3 min on top of the build; measured 80 passed / 0 failed at
      # f555070.
      - name: Run refute-crux verdict gate
        run: bash scripts/refute-crux-gate.sh

      # TOOL-RFC-002: the same gate, in LLMLL, deciding beside the shell one.
      # Adjacent steps on purpose (RFC §8 decision 1): `tool_state: oracle`
      # means both implementations run, and a reader compares their answers in
      # one job log rather than across two jobs.
      #
      # --subject is the freshly-built compiler and is passed EXPLICITLY (RFC
      # §8 decision 2). The harness and the compiler it grades are two
      # different binaries: once this job pulls a published image instead of
      # building, an implicit subject would be the IMAGE's compiler and all 41
      # refuted cases would go vacuously green. That is the defect this gate
      # exists to catch, so the port refuses to leave it implicit.
      #
      # The step budget comes from python3 and NOT `yes x | head -n N`: this
      # job inherits no pipefail, but build_smoke.sh does, and `yes` dies of
      # SIGPIPE by design, which reports 141 no matter what the gate decided.
      # Run from a scratch dir with an absolute --root, because a console
      # program writes <module>.event-log.jsonl into its working directory.
      - name: Run refute-crux verdict gate (LLMLL port, TOOL-RFC-002)
        run: |
          set -euo pipefail
          ROOT="$PWD"
          SUBJECT="$(cd compiler && stack path --local-install-root)/bin/llmll"
          OUT="$RUNNER_TEMP/refutecrux"
          ( cd tools/refute-crux && stack exec llmll -- build refutecrux.llmll -o "$OUT" )
          GATE="$(find "$OUT/.stack-work/install" -type f -name refutecrux -perm -111 | head -1)"
          [ -n "$GATE" ] || { echo "no refutecrux binary under $OUT"; exit 1; }
          mkdir -p "$RUNNER_TEMP/rc-work" "$RUNNER_TEMP/rc-run"
          # The differential cover first: it decides whether the port AGREES
          # with the reference, which a live green run on its own does not.
          # Sixteen cells, thirteen mutants that must be caught under BOTH
          # implementations plus three negative controls, over a scratch tree
          # whose cases live in two suites. That trim is what keeps this to
          # minutes rather than half an hour, and it bounds the cover to the
          # CRITERIA; corpus coverage is the live run below, which is why both
          # are here and neither is sufficient alone.
          python3 scripts/refute_crux_cover.py --gate "$GATE" --llmll "$SUBJECT"
          # Then the live corpus, which is the port deciding: all 80 frozen
          # verdicts against the compiler this job just built.
          ( cd "$RUNNER_TEMP/rc-run" \
              && python3 -c "import sys; sys.stdout.write('x\n' * 4000)" \
                   | "$GATE" --root "$ROOT" --subject "$SUBJECT" \
                             --work "$RUNNER_TEMP/rc-work" ) > "$RUNNER_TEMP/rc.log" 2>&1 \
            || { grep -v '^$' "$RUNNER_TEMP/rc.log" >&2; exit 1; }
          grep -v '^$' "$RUNNER_TEMP/rc.log"

      # BUILD-GATE-1. Belongs in this job and not in version-gate: that job is
      # deliberately Stack-free (see the header), and this gate's oracle is GHC.
      # Cheap here because generated projects pin the same resolver as the
      # compiler (lts-22.43, CodegenHs.hs emitStackYaml vs compiler/stack.yaml),
      # so ~/.stack is already warm from the build step above. The one-time cost
      # is `async` and `regex-tdfa`, which generated projects depend on and the
      # compiler does not.
      - name: Run end-to-end build gate (BUILD-GATE-1)
        working-directory: compiler
        env:
          LLMLL_BIN: stack exec llmll --
        run: bash ../scripts/build_smoke.sh

      - name: Run spec_roundtrip.py against opt-in LLMLL.md blocks
        working-directory: compiler
        env:
          LLMLL_BIN: stack exec llmll --
          SPEC_FILE: ../LLMLL.md
        run: python3 ../scripts/spec_roundtrip.py
