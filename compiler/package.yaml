name:                llmll
version:             0.33.0
synopsis:            LLMLL compiler - AI-to-AI programming language
description:         Compiler for the Large Language Model Logical Language
license:             GPL-3
author:              LLMLL Team
maintainer:          llmll@example.com

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wpartial-fields
  - -Wredundant-constraints

default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - DeriveAnyClass
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - LambdaCase
  - TupleSections

dependencies:
  - base >= 4.18 && < 5
  - text >= 2.0
  - containers >= 0.6
  - megaparsec >= 9.5
  - parser-combinators >= 1.3
  - mtl >= 2.3
  - aeson >= 2.1
  - aeson-pretty >= 0.8
  - optparse-applicative >= 0.18
  - QuickCheck >= 2.14
  - pretty-simple >= 4.1
  - bytestring >= 0.11
  - filepath >= 1.4
  - directory >= 1.3
  - process >= 1.6
  - vector >= 0.13
  - tar >= 0.5
  - zlib >= 0.6
  - unix >= 2.7
  - network >= 3.1     # D5: LLMLL.Serve socket server (kept for getAddrInfo)
  - random >= 1.2      # D5: token generation
  - warp >= 3.3        # D5: HTTP server
  - wai >= 3.2         # D5: WAI application interface
  - http-types >= 0.12 # D5: HTTP status codes + headers
  - time >= 1.12       # v0.3: checkout lock timestamps
  - cryptohash-sha256  # v0.3.1: proof cache obligation hashing
  - regex-tdfa >= 1.3  # REGEX-CAPTURE-1: check-time validation of literal regex patterns
  - scientific >= 0.3 # FLOAT-LIT-1: exact JSON numbers for the float-literal range rule (already in aeson's closure)

library:
  source-dirs: src
  exposed-modules:
    - LLMLL.Syntax
    - LLMLL.Lexer
    - LLMLL.Parser
    - LLMLL.ParserJSON
    - LLMLL.AstEmit
    # ADMIT-SHARED: leaf module over LLMLL.Syntax, imported by both the type
    # checker and the emitter. Must stay leaf — a dependency on either would
    # reintroduce the split it exists to remove.
    - LLMLL.TypeAdmissibility
    # XMOD-SCOPE: build-closure name scope (R1, R2, R3 codegen). Leaf over
    # LLMLL.Syntax and LLMLL.Diagnostic, imported by TypeCheck and Module.
    - LLMLL.BuildScope
    # REGEX-CAPTURE-1 / REGEX-CASE-1: the pattern rules `check` applies to a
    # literal regex pattern. Leaf over regex-tdfa; imported by TypeCheck.
    - LLMLL.RegexPattern
    # PBT-EVAL-PARITY-1: the pure runtime builtins, compiled, so the PBT
    # evaluator runs the code the generated program runs. Leaf module; a
    # Spec.hs test pins each block to runtimePreamble verbatim.
    - LLMLL.RuntimePure
    # FLOAT-LIT-1: the float-literal value and range rule, shared by the
    # S-expression parser and the JSON-AST reader. Leaf module.
    - LLMLL.FloatLit
    # FFI-TIER1-1: the Tier 1 Hackage boundary rules, shared by the type
    # checker, the emitter and the trust report. Leaf over LLMLL.Syntax.
    - LLMLL.Ffi
    - LLMLL.TypeCheck
    - LLMLL.HoleAnalysis
    - LLMLL.RespFact
    - LLMLL.Contracts
    - LLMLL.PBT
    - LLMLL.CodegenHs
    - LLMLL.Diagnostic
    - LLMLL.Module
    # XMOD-RUN-LOAD-1: the import-closure loader, shared by Main and PatchApply.
    # Separate from Module because it applies TrustReport.checkCacheEvidence.
    - LLMLL.LoadClosure
    - LLMLL.Hub
    - LLMLL.HubQuery
    # D4: liquid-fixpoint decoupled verification backend
    - LLMLL.FixpointIR
    - LLMLL.FixpointEmit
    - LLMLL.GuardClassifier
    - LLMLL.DiagnosticFQ
    # D5: HTTP serve endpoint
    - LLMLL.Serve
    # D5: Sketch output contract
    - LLMLL.Sketch
    # v0.3: checkout/patch lifecycle
    - LLMLL.JsonPointer
    - LLMLL.Checkout
    - LLMLL.PatchApply
    # REFINE-REUSE: reuse-retrieval for cascading refine
    - LLMLL.RefineReuse
    # v0.3: stratified verification
    - LLMLL.VerifiedCache
    # v0.3.1: event log
    - LLMLL.Replay
    # v0.3.1: leanstral MCP
    - LLMLL.LeanTranslate
    - LLMLL.MCPClient
    - LLMLL.ProofCache
    # v0.3.2: trust report
    - LLMLL.TrustReport
    # HEADLINE-TERM-1 + STRICT-XMOD-1: qualified whole-program call graph + caller closures
    - LLMLL.ProgramGraph
    - LLMLL.EvidenceKey
    # GENERICS-1 (S5): specialize each reached generic instantiation into a
    # def-shell copy before verification. Over Syntax, PBT, TypeAdmissibility.
    - LLMLL.Specialize
    # PARTIAL-FNS-GRAPH-1: the qualified call graph, importable by TrustReport
    - LLMLL.CallGraph
    # PROOF-ARTIFACT: unified reproducible verification record
    - LLMLL.ProofArtifact
    # TRUST-REPORT-GATE-1: the one JSON document 'verify --json' prints
    - LLMLL.VerifyEnvelope
    # v0.3.4: agent spec generator
    - LLMLL.AgentSpec
    # v0.3.5: weak-spec counter-example generation
    - LLMLL.WeaknessCheck
    # LT-CDP (v0.11): contract discriminative power evidence axis
    - LLMLL.CDP
    # cascade-l3: refine feasibility (no-miracle) gate
    - LLMLL.Feasibility
    # v0.4: invariant pattern registry
    - LLMLL.InvariantRegistry
    # v0.4: downstream obligation mining
    - LLMLL.ObligationMining
    # v0.6: spec coverage metric
    - LLMLL.SpecCoverage
    # v0.10: obligation report assembly
    - LLMLL.ObligationAssembly
    # R5: differential implementation pressure (observational divergence witness)
    - LLMLL.DivergenceCheck

executables:
  llmll:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
      - -optP-Wno-nonportable-include-path
      - -optc-Wno-nonportable-include-path
    dependencies:
      - llmll

tests:
  llmll-test:
    main:                Spec.hs
    source-dirs:         test
    dependencies:
      - llmll
      - hspec >= 2.11
      - hspec-megaparsec >= 2.2
      - QuickCheck
      - aeson
      - time >= 1.12
